name: Publish

on:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      next_version: ${{ steps.semver.outputs.nextStrict }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: v3
          skipInvalidTags: true
          patchList: fix, bugfix, perf, refactor, test, tests, chore

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package.json version
        run: |
          yq -iP '.version = "${{ steps.semver.outputs.nextStrict }}"' package.json -o json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Publish to NPM
        run: npm publish --access public --tag latest

      - name: Create Draft Release
        uses: ncipollo/release-action@v1.21.0
        with:
          prerelease: true
          draft: false
          commit: ${{ github.sha }}
          tag: ${{ steps.semver.outputs.nextStrict }}
          name: ${{ steps.semver.outputs.nextStrict }}
          body: '*pending*'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CHANGELOG
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ steps.semver.outputs.nextStrict }}
          writeToFile: false

      - name: Finalize Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          makeLatest: true
          draft: false
          body: ${{ steps.changelog.outputs.changes }}
          tag: ${{ steps.semver.outputs.nextStrict }}
          name: ${{ steps.semver.outputs.nextStrict }}
          token: ${{ secrets.GITHUB_TOKEN }}

  website:
    runs-on: ubuntu-latest
    needs: [npm]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout idnits-www repo
        uses: actions/checkout@v7
        with:
          repository: ietf-tools/idnits-www
          ref: main
          token: ${{ secrets.GH_COMMON_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Wait for package to be available on npm
        env:
          VERSION: ${{ needs.npm.outputs.next_version }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf -H "Accept: application/vnd.npm.install-v1+json" \
                "https://registry.npmjs.org/@ietf-tools%2Fidnits" \
                | jq -e --arg v "$VERSION" '.versions[$v]' > /dev/null; then
              echo "@ietf-tools/idnits@$VERSION is available"
              exit 0
            fi
            echo "Not available yet (attempt $i), retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for @ietf-tools/idnits@$VERSION"
          exit 1

      - name: Bump idnits package version
        run: npm install && npm install @ietf-tools/idnits@${{needs.npm.outputs.next_version}}

      - name: Commit updated package.json
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: 'chore: update idnits dependency to ${{needs.npm.outputs.next_version}}'
          file_pattern: package.json package-lock.json
