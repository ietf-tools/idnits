name: Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ github.workspace }}/idnits
          fetch-depth: 0

      - name: Set Build Variables
        run: |
          echo "NEXT_VERSION=3.0.0-alpha.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          registry-url: https://registry.npmjs.org/

      - name: Set package.json version
        uses: KageKirin/set-node-package-version@v1.0.0
        with:
          file: idnits/package.json
          version: ${{ env.NEXT_VERSION }}

      - name: Install NPM Dependencies
        working-directory: ./idnits
        run: npm ci

      - name: Run Tests
        working-directory: ./idnits
        run: npm test

      - name: Publish to NPM
        working-directory: ./idnits
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Checkout idnits-www repo
        uses: actions/checkout@v4
        with:
          repository: ietf-tools/idnits-www
          ref: main
          token: ${{ secrets.GH_COMMON_TOKEN }}
          path: ${{ github.workspace }}/idnits-www
          fetch-depth: 1

      - name: Bump idnits package version
        working-directory: ./idnits-www
        run: npm install && npm install @ietf-tools/idnits@${{ env.NEXT_VERSION }}

      - name: Commit updated package.json
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          repository: ${{ github.workspace }}/idnits-www
          branch: main
          commit_message: 'chore: update idnits dependency to ${{ env.NEXT_VERSION }}'
          file_pattern: package.json package-lock.json
