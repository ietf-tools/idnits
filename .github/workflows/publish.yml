name: Publish

on:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      next_version: ${{ steps.semver.outputs.nextStrict }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          skipInvalidTags: true
          patchList: fix, bugfix, perf, refactor, test, tests, chore

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package.json version
        run: |
          yq -iP '.version = "${{ steps.semver.outputs.nextStrict }}"' package.json -o json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Publish to NPM
        run: npm publish --access public --tag latest

      - name: Create GH Release
        uses: ncipollo/release-action@v1.21.0
        with:
          makeLatest: true
          commit: ${{ github.sha }}
          tag: ${{ steps.semver.outputs.nextStrict }}
          name: ${{ steps.semver.outputs.nextStrict }}
          token: ${{ secrets.GITHUB_TOKEN }}

  website:
    runs-on: ubuntu-latest
    needs: [npm]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout idnits-www repo
        uses: actions/checkout@v7
        with:
          repository: ietf-tools/idnits-www
          ref: main
          token: ${{ secrets.GH_COMMON_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Bump idnits package version
        run: npm install && npm install @ietf-tools/idnits@${{needs.npm.outputs.next_version}}

      - name: Commit updated package.json
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: 'chore: update idnits dependency to ${{needs.npm.outputs.next_version}}'
          file_pattern: package.json package-lock.json
